cv:
  name: Pearl Ayem
  label: Climate & Nature Risk Lead
  email: pearlayem@gmail.com
  location: London, UK
  image: ""
  summary: >-
    Climate and nature risk leader, data engineer and atmospheric scientist who
    turns physical science into financial risk for boards, investors and
    governments. Leads a cross-functional team quantifying physical, transition
    and supply-chain risk for FTSE 100 companies, asset managers, insurers and
    global brands, as well as the firm's applied AI programme. Has advised the
    C-suites of food, apparel, luxury, retail and construction companies with
    combined annual revenue of over $200 billion. At Bloomberg, on secondment to
    GFANZ, designed the data model for the Net-Zero Data Public Utility,
    launched at COP28, and wrote speech content and figures delivered by Mark
    Carney and Michael Bloomberg. Started out in Western Canada with LiDAR drone
    mapping and atmospheric fieldwork, then won a full scholarship to Cambridge.
    A hands-on engineer, architected a BigQuery pipeline over hundreds of
    terabytes of climate data and cut its cloud storage costs by 94%.

  social_networks:
    - network: LinkedIn
      username: pearl-ayem
    - network: GitHub
      username: Pearl-Ayem

  sections:
    Experience:
      - position: Lead Environmental Risk Modeller
        company: Risilience
        location: London, UK
        start_date: Mar 2025
        summary: Climate and nature risk analytics for FTSE 100 companies, asset managers, insurers and global consumer brands.
        highlights:
          - Lead cross-functional team of modellers, economists, data scientists and engineers delivering climate and nature risk analytics to FTSE 100 companies, asset managers, insurers and global consumer brands.
          - Own the planning and delivery of climate, nature and supply-chain risk models that quantify physical and transition risk in financial terms across multiple sectors.
          - Lead the planning and build of a company-wide digital twin that assesses financial and climate risk from drought, freeze, heatwave, water stress, agricultural yield loss and nature depletion.
          - Lead for supply-chain and agricultural risk models spanning 30+ crops, fed by bias-corrected CMIP6 ensembles, satellite data and academic sources.
          - Architected and built a first-of-its-kind global crop water balance engine on Google BigQuery, simulating daily soil moisture for 10 commodity crops across ~1.5 million locations at ~9 km resolution, under different models and future scenarios. It processes 570+ billion rows of daily climate data into a 1.1 billion-row output that quantifies water stress across the supply chains of major food, fashion and entertainment brands ([case study](/projects/water_balance_engine/)).'
          - Re-architected data-enineering pipeline to stream daily simulations directly into annual results, eliminating 634 TB (2.1 trillion rows) of intermediate tables. This cut cloud storage costs by 94% (from ~$14,000 to under $900 a month) and first-year pipeline cost from $172K to under $11K.
          - Cut the full global run of 35 climate scenarios from days to ~14 hours on 4 parallel workers (~45 minutes per scenario). The legacy multi-pass design scanned over 18 PB of data; replacing it cut compute costs by over 99%.
          - Resolved production scaling failures in BigQuery, including JavaScript UDF memory exhaustion, 62 TB shuffle spills and DML quota limits, through memory-efficient UDF design (from over 512 MB to under 2 MB per worker), hierarchical geospatial batching, table re-clustering and fault-tolerant, resumable Python orchestration.
          - Onboarded and harmonised varied datasets (NASA NEX-GDDP-CMIP6, EarthStat, SoilGrids, SRTM elevation, WRI Aqueduct) onto a common global grid to onboard future data without code changes.
          - Own data quality at billion-row scale, with audit queries that isolate anomalies by scenario and region, idempotent slice replacement, and provenance logging for every run.
          - Researched and selected CMIP6 ensemble spanning the full range of climate sensitivity, cutting simulation runs by 77% while preserving scientific coverage.
          - Part of firm's AI upgrades team, building agentic workflows with LangGraph and LangSmith that halved model release cycles (from 8 weeks to 4), and trialling enterprise LLM tooling (Gemini, Vertex AI, NotebookLM) for research and client analytics.

      - position: Senior Climate Risk Modeller
        company: Sillion
        location: London, UK
        start_date: Dec 2023
        end_date: Feb 2025
        summary: Climate risk and sustainability advisory for FTSE 100 and FTSE 250 companies and asset managers.
        highlights:
          - Led climate risk engagements for FTSE 100 and FTSE 250 clients, delivering scenario analysis, earnings-at-risk, transition risk and double materiality assessments.
          - Built Python risk models quantifying earnings-at-risk under multiple climate scenarios, integrated directly into clients' financial dashboards.
          - Integrated results into clients' TCFD/ISSB, CSRD, TPT, SECR, CDP and GRI disclosures and annual reports, and advised on alignment with Canada's CSSB standards (CSDS 1 and 2).
          - Built the firm's first transition-planning dashboard, combining economic and climate models to support reporting under TPT, CSRD and CSDDD.
          - Product Lead for an ESG research tool tracking KPIs across 600+ companies, integrated into Power BI, Tableau and Excel workflows.
          - Sold climate risk models to asset managers and FTSE corporates, personally closing around two contracts a year, the largest worth £820K and several in the £150K–200K range; supported RFPs and sales on around six a year.
          - Presented to C-suites, boards and press (media-trained); built recurring business through partnerships and professional networks.
          - Managed and mentored junior analysts and consultants.

      - position: Net-Zero Data Lead
        company: 'Bloomberg L.P. (secondment to GFANZ and the Net-Zero Data Public Utility)'
        location: London, UK
        start_date: Jun 2022
        end_date: Nov 2023
        summary: 'On secondment to the Glasgow Financial Alliance for Net Zero (GFANZ), building the [Net-Zero Data Public Utility](https://climatedatautility.org/home), a free global climate-transition data platform now hosted by the UNFCCC as the Climate Data Utility.'
        highlights:
          - 'Designed the complete data model for the Net-Zero Data Public Utility, [launched at COP28 by President Emmanuel Macron and Michael Bloomberg](https://www.climatedatasc.org/president-emmanuel-macron-and-michael-r-bloomberg-deliver-proof-of-concept-for-groundbreaking-net-zero-data-public-utility-at-cop28/).'
          - 'Wrote speech content and figures delivered by [Mark Carney](https://www.linkedin.com/posts/mark-carney-5b9744205_nzdpu-undefined-activity-7244797832501587969-LtQG) (then UN Special Envoy for Climate Action and Finance, now Prime Minister of Canada) and Michael Bloomberg.'
          - Wrote the COP28 launch briefing and built the user guides and demos shown at the COP28 booths.
          - Oversaw the work of Google's engineers, the platform's external technical partner, through to launch.
          - 'Ran vendor interviews and evaluation with the CTO and the head of the project, helped author the [NZDPU request for proposal](https://assets.bbhub.io/company/sites/71/2022/11/request-for-proposal-2022.pdf), and cleaned and prepared the platform''s data.'
          - 'Built a climate reporting model for GFANZ and worked with stakeholders including President Macron''s office, the governments of [Switzerland and Singapore](https://www.responsible-investor.com/singapore-and-switzerland-sign-up-to-global-climate-data-project/), CDP and the UNFCCC, supporting the [Climate Data Steering Committee''s recommendations](https://www.climatedatasc.org/climate-data-steering-committee-proposes-recommendations-for-the-development-of-first-ever-publicly-accessible-climate-data-utility/) and the [GFANZ Principals Group statement of support](https://www.gfanzero.com/press/gfanz-principals-group-issues-nzdpu-statement-of-support/).'
          - 'Helped secure the [CDP partnership](https://www.cdp.net/en/articles/media/cdp-and-nzdpu-collaborate-to-accelerate-access-to-core-climate-data) that brought 10,000+ companies'' climate data onto the platform.'
          - 'Managed a team of 40 analysts for GFANZ''s [COP27 data launch](https://www.gfanzero.com/press/gfanz-launches-critical-resources-for-financial-institutions-to-convert-their-net-zero-ambition-into-action/), and prepared briefs on 700 climate KPIs for [Michael Bloomberg''s COP27 keynote](https://a-teaminsight.com/blog/cop27-announcements-highlight-critical-role-of-esg-data/).'
          - 'Co-authored [GFANZ''s guidance on financial institution net-zero transition plans](https://assets.bbhub.io/company/sites/63/2022/09/Recommendations-and-Guidance-on-Financial-Institution-Net-zero-Transition-Plans-November-2022.pdf) and the [NZDPU development report](https://assets.bbhub.io/company/sites/71/2022/11/development-of-the-net-zero-data-public-utility-november-2022.pdf) with partners from the ISSB and IEA.'
          - Sold climate data and analytics to asset managers and commodities trading firms.
          - Built ETL pipelines and APIs ingesting data from hundreds of providers; subject-matter expert on Scope 1, 2 and 3 emissions, reporting standards and jurisdictional policy, including Canada's OSFI Guideline B-15 and CSA climate disclosure rules.

      - position: Climate Science Researcher
        company: University of Cambridge & British Antarctic Survey
        location: Cambridge, UK
        start_date: Oct 2021
        end_date: Jun 2022
        summary: 'MPhil research at the Scott Polar Research Institute, funded by the Scott Polar Scholarship ([thesis](/thesis/)).'
        highlights:
          - Investigated the atmospheric drivers of surface melt on the George VI Ice Shelf, Antarctica, over 32 years.
          - Analysed 1.7 billion geospatial data points across CMIP5 global and regional climate models and NOAA and Copernicus observations; built a convolutional neural network and EOF analysis to identify seasonal melt patterns.
          - 'Presented findings at conferences; the work is now [used as teaching material](https://twitter.com/PolarImpact/status/1463252358121631753) on Cambridge''s MPhil programme, and was [featured on Cambridge''s channels](https://www.caths.cam.ac.uk/polar-impact).'
          - Supervised by Professor Ian Willis (Scott Polar Research Institute) and Dr Amélie Kirchgaessner (British Antarctic Survey).
          - 'Tech stack: Python, xarray, pandas, geopandas, scipy, scikit-learn, eofs, pyproj, netCDF, HDF5, rasterio, GDAL, Shapely, fiona, cartopy, matplotlib, plotly.'

      - position: Brand Manager, Sustainability
        company: P.G.A. Hospitality
        location: Vancouver, Canada
        start_date: Sep 2018
        end_date: Oct 2021
        summary: Sustainable business development for a Vancouver hospitality group.
        highlights:
          - Contracted to the CEO to lead sustainable business development; managed a team of 10.
          - Grew revenue by 233% and profits by 31%, and raised CAD 1.5M in investment.
          - Secured contracts with local, sustainable suppliers to keep operations running through pandemic supply-chain disruption.
          - Wrote and won an RFP bid for a new location; developed business plans, marketing materials and seasonal menus.
          - The business earned 9 awards and a place in Greater Vancouver's Top 30 cafés.

      - position: Geospatial Engineer
        company: UAViation Aerial Solutions
        location: Vancouver, Canada
        start_date: Jul 2018
        end_date: Sep 2019
        summary: LiDAR drone mapping and flight-automation software; the company was later acquired by Volatus Aerospace.
        highlights:
          - Project Lead for LiDAR drone mapping operations and GIS post-processing across British Columbia, Alberta and Yukon.
          - Delivered 18 projects in 12 months for government, BC Wildfire Service, search-and-rescue, natural resource, academic and private-sector clients.
          - Team Lead for the software team building the company's flight-automation app (Android Studio, REST APIs, Google Maps API, DJI UX SDK).
          - Solved photogrammetry and LiDAR flight-mapping problems in C++, Java and Python; post-processed with Pix4D, ArcGIS and QGIS.
          - Supported the CEO in client meetings; my work contributed to the company's acquisition by Volatus Aerospace.

      - position: Research Assistant, Atmospheric Science
        company: University of British Columbia
        location: Vancouver, Canada
        start_date: Dec 2016
        end_date: May 2020
        summary: Fieldwork and remote sensing across the Earth, Ocean and Atmospheric Sciences department's research labs.
        highlights:
          - Built, installed and calibrated weather and carbon flux stations to WMO standards to study blue carbon, bog carbon flux and the urban heat island effect in Vancouver.
          - Took eddy-covariance measurements during the Buckley Bay wildfires and tested diffuse-radiation fertilisation against NASA aerosol data (contributed to McKendry et al., 2019).
          - Sampled and analysed phytoplankton in Burrard Inlet to assess its role as a carbon sink.
          - 'Studied glacial katabatic winds and [cloud-street formation](/projects/cloud_streets_clustering/) over Greenland using MODIS, GOES-16/17 and Landsat 7/8 imagery and ECMWF reanalysis, with PCA, Sobel edge detection, Self-Organizing Maps and CNNs.'
          - Built ETL pipelines on AWS EC2 and S3, processing GOES satellite data from NOAA's public archive.

      - position: Lead Teaching Assistant, Computer Science
        company: University of British Columbia
        location: Vancouver, Canada
        start_date: Dec 2016
        end_date: Jun 2020
        summary: Head Teaching Assistant for Computer Science.
        highlights:
          - Managed 18 TAs and taught Python and C++ labs and lectures to 1,000 students; Best TA award three years running.
          - 'Helped pilot a new data science course, writing modules on climate data computing and [contrast stretching](/projects/contrast_stretching/) of satellite imagery.'

